model_list:
  - model_name: deepseek-v4-flash-thinking
    litellm_params:
      model: hosted_vllm/deepseek-v4-flash-0731
      api_base: os.environ/HOSTED_INFERENCE_API_BASE
      reasoning_effort: high
      extra_body:
        chat_template_kwargs:
          thinking: true
          enable_thinking: true
    model_info:
      max_input_tokens: 1048576

  - model_name: glm-5.3-flash-high
    litellm_params:
      model: anthropic/glm-5.3-flash-quark-mxfp4
      api_base: os.environ/HOSTED_INFERENCE_ANTHROPIC_BASE
      api_key: os.environ/HOSTED_INFERENCE_API_KEY
      reasoning_effort: high
    model_info:
      max_input_tokens: 1048576
      supports_reasoning: true
      supports_adaptive_thinking: true
      supports_output_config: true
      supports_low_reasoning_effort: true
      supports_xhigh_reasoning_effort: true
      supports_max_reasoning_effort: true

  - model_name: qwen3.8-flash-next-fast
    litellm_params:
      model: hosted_vllm/qwen3.8-flash-next-fp8
      api_base: os.environ/HOSTED_INFERENCE_API_BASE
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
          preserve_thinking: false
    model_info:
      max_input_tokens: 262144

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  callbacks:
    - litellm_hooks.proxy_handler_instance
